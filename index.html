<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Maafin Aku Ya?</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #fff9c4, #ffe082);
        font-family: "Fredoka", sans-serif;
        text-align: center;
        overflow: hidden;
        padding: 20px;
      }
      .container {
        display: none;
        background: white;
        padding: 30px 20px;
        border-radius: 35px;
        box-shadow: 0 15px 35px rgba(255, 179, 0, 0.3);
        position: relative;
        z-index: 1;
        border: 5px solid #ffca28;
        width: 100%;
        max-width: 340px;
      }
      img.gif {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 20px;
        margin-bottom: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #ff9800;
        font-size: 22px;
        margin-bottom: 25px;
        font-weight: 600;
      }
      .btn-group {
        position: relative;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      button {
        padding: 12px 28px;
        font-size: 16px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-weight: 600;
        font-family: "Fredoka", sans-serif;
        transition: transform 0.2s ease;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        -webkit-tap-highlight-color: transparent;
      }
      button:hover {
        transform: translateY(-5px) scale(1.05);
      }
      button:active {
        transform: scale(0.95);
      }
      #btn-yes {
        background: linear-gradient(45deg, #ffca28, #ff9800);
        color: white;
        box-shadow: 0 6px 18px rgba(255, 152, 0, 0.4);
      }
      #btn-no {
        background: #fff;
        color: #ff9800;
        border: 3px solid #ff9800;
        position: absolute;
        right: 15px;
      }

      /* Modifikasi Pop-up Khusus Layar HP */
      .swal2-popup {
        border-radius: 25px !important;
        border: 4px solid #ffca28 !important;
        background-color: #fffde7 !important;
        width: 85% !important;
        padding: 20px 10px !important;
      }
      .swal2-title {
        color: #ff9800 !important;
        font-family: "Fredoka", sans-serif !important;
        font-size: 20px !important;
      }
      .swal2-html-container {
        font-size: 14px !important;
      }
      .swal2-confirm {
        border-radius: 50px !important;
        font-family: "Fredoka", sans-serif !important;
        padding: 10px 28px !important;
        font-size: 16px !important;
        background: linear-gradient(45deg, #ffca28, #ff9800) !important;
        box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3) !important;
      }
    </style>
  </head>
  <body>
    <div class="container" id="main-container">
      <img src="mohon.jfif" alt="Nailong Memohon" class="gif" />
      <h1>Beneran dimaafin kan? 🥺</h1>
      <div class="btn-group">
        <button id="btn-yes" onclick="dimaafin()">Iya sayang</button>
        <button
          id="btn-no"
          onmouseover="kabur()"
          ontouchstart="kabur()"
          onclick="kabur()"
        >
          Gak!
        </button>
      </div>
    </div>

    <script>
      window.onload = function () {
        Swal.fire({
          title: "Halo kesayangankuuu!",
          text: "Ada yang mau aku omongin nih cantikk...",
          imageUrl: "halo.jfif",
          imageWidth: 130, // Dikecilkan sedikit agar pas di HP
          imageHeight: 130,
          confirmButtonText: "Apa tuh?",
          allowOutsideClick: false,
        }).then((result) => {
          if (result.isConfirmed) {
            Swal.fire({
              title: "Aku tau aku salah 😔",
              text: "Maafin aku ya...",
              imageUrl: "sedih.jfif",
              imageWidth: 130,
              imageHeight: 130,
              confirmButtonText: "Terus?",
              allowOutsideClick: false,
            }).then((result) => {
              if (result.isConfirmed) {
                Swal.fire({
                  title: "Jangan ngambek lagi dong 🥺",
                  text: "Aku janji deh gak bakal ngulangin lagi.",
                  imageUrl: "mohon.jfif",
                  imageWidth: 130,
                  imageHeight: 130,
                  confirmButtonText: "Iya...",
                  allowOutsideClick: false,
                }).then((result) => {
                  if (result.isConfirmed) {
                    document.getElementById("main-container").style.display =
                      "block";
                  }
                });
              }
            });
          }
        });
      };

      function kabur() {
        const btnNo = document.getElementById("btn-no");

        // Menambahkan margin area agar tombol tidak keluar dari layar HP
        const padding = 20;
        const maxX = window.innerWidth - btnNo.offsetWidth - padding;
        const maxY = window.innerHeight - btnNo.offsetHeight - padding;

        const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
        const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

        btnNo.style.position = "fixed";
        btnNo.style.left = randomX + "px";
        btnNo.style.top = randomY + "px";
      }

      function dimaafin() {
        Swal.fire({
          title: "Yeaaay! Makasih sayangg! ❤️",
          text: "Kabarin aku di WA yaa kalau udah ngebaca ini.",
          imageUrl: "senang.jfif",
          imageWidth: 130,
          imageHeight: 130,
          confirmButtonText: "Kirim WA ke Bububb",
          allowOutsideClick: false,
        }).then((result) => {
          if (result.isConfirmed) {
            window.location.href =
              "https://wa.me/6282247309260?text=Iyaaa%20bubb,%20udah%20aku%20maafin%20kok%20%E2%9D%A4%EF%B8%8F";
          }
        });
      }
    </script>
  </body>
</html>
